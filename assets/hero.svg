<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Raj Kasaudhan, software engineer and builder in Bangalore India, with a terminal committing, pushing and deploying nine live products">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.5" r="0.62">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c9d1d9" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="18"/></clipPath>
    <clipPath id="type0">
      <rect x="780" y="120" height="22" width="0">
        <animate attributeName="width" values="0;0;300;300;0;0"
          keyTimes="0;0.0;0.178;0.93;0.935;1"
          dur="9.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="type1">
      <rect x="780" y="150" height="22" width="0">
        <animate attributeName="width" values="0;0;300;300;0;0"
          keyTimes="0;0.222;0.389;0.93;0.935;1"
          dur="9.0s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#0d1117"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
  </g>

  <!-- terminal -->
  <rect x="762" y="52" width="382" height="208" rx="11" fill="#010409" stroke="#30363d"/>
  <circle cx="786" cy="76" r="5" fill="#f85149" fill-opacity="0.8"/>
  <circle cx="804" cy="76" r="5" fill="#d29922" fill-opacity="0.8"/>
  <circle cx="822" cy="76" r="5" fill="#3fb950" fill-opacity="0.8"/>
  <text class="mono" x="844" y="80" font-size="11" fill="#484f58">raj@build</text>
  <line x1="762" y1="96" x2="1144" y2="96" stroke="#21262d"/>
    <text class="mono" x="784" y="136" clip-path="url(#type0)"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">git commit -m 'ship it'</tspan></text>
    <text class="mono" x="784" y="166" clip-path="url(#type1)"><tspan fill="#58a6ff">$ </tspan><tspan fill="#e6edf3">git push origin main</tspan></text>
    <text class="mono" x="784" y="196" opacity="0"><tspan fill="#3fb950">✓ </tspan><tspan fill="#8b949e">deployed in 41s</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0"
        keyTimes="0;0.444;0.483;0.93;0.935;1"
        dur="9.0s" repeatCount="indefinite"/>
    </text>
    <text class="mono" x="784" y="226" opacity="0"><tspan fill="#58a6ff">● </tspan><tspan fill="#8b949e">9 products live</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0"
        keyTimes="0;0.522;0.561;0.93;0.935;1"
        dur="9.0s" repeatCount="indefinite"/>
    </text>
    <rect x="784" y="236" width="9" height="16" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1"
        dur="1.1s" repeatCount="indefinite"/>
    </rect>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text class="mono" x="64" y="92" font-size="14" font-weight="600" letter-spacing="0.22em" fill="#58a6ff">SOFTWARE ENGINEER  ·  BUILDER</text>
  <text class="sans" x="62" y="166" font-size="62" font-weight="800" letter-spacing="-0.02em" fill="#e6edf3">Raj Kasaudhan</text>
  <rect x="64" y="190" width="180" height="2" rx="1" fill="url(#rule)"/>
  <text class="sans" x="64" y="228" font-size="20" fill="#8b949e">Mobile apps · Web platforms · Rust services · On-device AI</text>
  <text class="mono" x="64" y="262" font-size="13" letter-spacing="0.06em" fill="#6e7681">Bangalore, India · rajkasaudhan.com.np</text>
</svg>
