<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="160" viewBox="0 0 1000 160" role="img" aria-label="A loop: idea, build, ship, listen, and again">
  <line x1="120" y1="46" x2="900" y2="46" stroke="#21262d" stroke-width="2"/>

  <circle cx="120" cy="46" r="8" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0">
    <animate attributeName="r" values="8;8;28;8;8" keyTimes="0;0.0375;0.1375;0.1385;1" dur="8.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.0375;0.1375;0.1385;1" dur="8.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="46" r="8" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0">
    <animate attributeName="r" values="8;8;28;8;8" keyTimes="0;0.25;0.35;0.351;1" dur="8.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.25;0.35;0.351;1" dur="8.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="640" cy="46" r="8" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0">
    <animate attributeName="r" values="8;8;28;8;8" keyTimes="0;0.5;0.6;0.601;1" dur="8.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.5;0.6;0.601;1" dur="8.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="46" r="8" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0">
    <animate attributeName="r" values="8;8;28;8;8" keyTimes="0;0.75;0.85;0.851;1" dur="8.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;0.6;0;0" keyTimes="0;0.75;0.85;0.851;1" dur="8.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="46" r="9" fill="#0d1117" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#30363d;#58a6ff;#58a6ff;#30363d" keyTimes="0;0.0375;0.0575;0.93;0.94" dur="8.0s" repeatCount="indefinite"/>
  </circle>
  <text x="120" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#6e7681">IDEA
    <animate attributeName="fill" values="#6e7681;#6e7681;#e6edf3;#e6edf3;#6e7681" keyTimes="0;0.0375;0.0575;0.93;0.94" dur="8.0s" repeatCount="indefinite"/>
  </text>
  <circle cx="380" cy="46" r="9" fill="#0d1117" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#30363d;#58a6ff;#58a6ff;#30363d" keyTimes="0;0.25;0.27;0.93;0.94" dur="8.0s" repeatCount="indefinite"/>
  </circle>
  <text x="380" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#6e7681">BUILD
    <animate attributeName="fill" values="#6e7681;#6e7681;#e6edf3;#e6edf3;#6e7681" keyTimes="0;0.25;0.27;0.93;0.94" dur="8.0s" repeatCount="indefinite"/>
  </text>
  <circle cx="640" cy="46" r="9" fill="#0d1117" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#30363d;#58a6ff;#58a6ff;#30363d" keyTimes="0;0.5;0.52;0.93;0.94" dur="8.0s" repeatCount="indefinite"/>
  </circle>
  <text x="640" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#6e7681">SHIP
    <animate attributeName="fill" values="#6e7681;#6e7681;#e6edf3;#e6edf3;#6e7681" keyTimes="0;0.5;0.52;0.93;0.94" dur="8.0s" repeatCount="indefinite"/>
  </text>
  <circle cx="900" cy="46" r="9" fill="#0d1117" stroke="#30363d" stroke-width="2">
    <animate attributeName="stroke" values="#30363d;#30363d;#58a6ff;#58a6ff;#30363d" keyTimes="0;0.75;0.77;0.93;0.94" dur="8.0s" repeatCount="indefinite"/>
  </circle>
  <text x="900" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.14em" fill="#6e7681">LISTEN
    <animate attributeName="fill" values="#6e7681;#6e7681;#e6edf3;#e6edf3;#6e7681" keyTimes="0;0.75;0.77;0.93;0.94" dur="8.0s" repeatCount="indefinite"/>
  </text>

  <circle r="5" cy="46" fill="#58a6ff">
    <animate attributeName="cx"
      values="120;120;380;380;640;640;900;900;900"
      keyTimes="0;0.075;0.25;0.325;0.5;0.575;0.75;0.93;1"
      dur="8.0s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.92;0.95;0.99;1" dur="8.0s" repeatCount="indefinite"/>
  </circle>

  <!-- return arc, split so the caption sits in the gap -->
  <path d="M 900 100 C 900 138, 760 142, 600 142" fill="none" stroke="#21262d" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M 420 142 C 260 142, 120 138, 120 100" fill="none" stroke="#21262d" stroke-width="2" stroke-dasharray="5 6"/>
  <path d="M 120 92 l -5 10 l 10 0 z" fill="#21262d"/>
  <text x="510" y="147" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.16em" fill="#484f58">AND AGAIN</text>
</svg>
